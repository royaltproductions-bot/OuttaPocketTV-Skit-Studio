name: Verify public OuttaPocketTV video metadata
on:
  push:
    paths: ['.github/workflows/verify-public-tiktok.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: Fetch TikTok embeds and captions
        shell: python
        run: |
          import urllib.request, json, re, html
          base="https://www.tiktok.com/@outtapockettv101/video/"
          ids=["7697383876368305421","7700480890257820941","7689585593273142541","7702540656266284302","7702210754451164430","7702201665935445261"]
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36'}
          for vid in ids:
            url='https://www.tiktok.com/oembed?url='+base+vid
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=12) as r:
                data=json.loads(r.read().decode())
              print('OEMBED',vid,'title',repr(data.get('title')),'author',repr(data.get('author_name')),'thumbnail',bool(data.get('thumbnail_url')),flush=True)
            except Exception as e: print('OEMBED ERROR',vid,str(e)[:150],flush=True)
          with urllib.request.urlopen(urllib.request.Request('https://www.tiktok.com/embed/@outtapockettv101',headers=headers),timeout=20) as r:
            raw=r.read().decode('utf-8','replace')
          print('PROFILE_BYTES',len(raw),flush=True)
          matches=list(re.finditer(r'<a target="_blank" href="https://www.tiktok.com/@outtapockettv101/video/(\d+)',raw))
          for m in matches[:12]:
            id=m.group(1)
            block=raw[m.end():m.end()+17000]
            title=re.search(r'<img[^>]+alt="([^"]+)"',block)
            pin='Pinned' in raw[max(m.start()-500,0):m.start()+12000]
            print('PROFILE',id,'PIN?',pin,'ALT',html.unescape(title.group(1))[:220] if title else 'none',flush=True)
