name: Publisher Browser Audit
on:
  push:
    paths:
      - '.github/workflows/publisher-audit.yml'
      - 'tests/browser_smoke.py'
      - 'static/index.html'
      - 'static/app.css'
      - 'static/about.html'
      - 'static/privacy.html'
      - 'static/terms.html'
      - 'static/contact.html'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install app and browser
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Verify desktop and mobile layouts and real video URLs
        run: |
          python -m uvicorn server:app --port 8080 --host 127.0.0.1 > /tmp/optv-web.log 2>&1 &
          sleep 3
          python tests/browser_smoke.py
