name: One-time encrypted OpenAI key handoff
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-key-handoff.yml
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Encrypt existing GitHub secret for transfer to Render
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_KEY:-}" ]]; then
            echo "OPENAI_API_KEY is not configured in this repository"
            exit 1
          fi
          cat > "$RUNNER_TEMP/optv-public.pem" <<'OPTVCODEX'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAoh+PJDXNH2fcqaflDPIJ
          9l2BX8a8uj66seELSfMXUr3GPRwsTKkdyIjF7jiECVkPUaMcpEJODHtR4JsvN0JG
          1c6V2GTOeAP/MxTu06YXD2EFYay9olsGhaZjqeyXD+CxDP9M5ZIE9UxrE5qm78e5
          x16x6OR4ziAJpHJfo14FQ+UT/riZJ+Iq7fEWbQjZuaSCxVS35HzAPKiYzRwjQdGx
          HofOHuDcmRayQb86BXFnWLM6ktEI2wH8bD1bTAkVG+FvJFlPNYucPWg2YZXb3jwj
          EqJqaxobvCE3rQLawtLfn6hcoBrVz5+EvkfYKSAiH7oViP+isyGbY7KOMOd6DejM
          gfkvQnlJ1W23PYYBBglaiXyhjdyQZ4HRiI2KW6kUS9tx5ccwpOEcz4iddXhLpdAz
          3fJu2WlR6Afm1Ya99JSHgyzN/lIBFI8YtygpHdDS1eHxbmKFJAD82foxukGiIB1a
          c1km/og96MfNefvIfMCyglRobokpBG0fiokBjmpIjiNG91shnntdNoUjFERI3YCn
          RAKdHy785vRUg+gZC4Sg44hugTUFbbVjV22+++0SUEbWtKtUH4eEqc2DQ2BmEQHM
          t/Izsm4uby5UGyD0asYKwsnscRgiBqqQ3n2TEELWf4HdQzyOCE2fTSIMpMsi3W8B
          FfKLYAHae2t0sm+dBGeMQmcCAwEAAQ==
          -----END PUBLIC KEY-----
          OPTVCODEX
          encrypted="$(printf '%s' "$OPENAI_KEY" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/optv-public.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          if [[ -z "$encrypted" ]]; then
            echo "Encrypted handoff failed"
            exit 1
          fi
          printf 'OPTV_ENCRYPTED_HANDOFF=%s\n' "$encrypted"
