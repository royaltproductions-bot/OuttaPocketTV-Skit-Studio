name: Production Pilot Tests
on:
  push:
    paths:
      - 'server.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'static/**'
      - 'Dockerfile'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test storefront and safety checks
        run: python -m unittest discover -s tests -v
