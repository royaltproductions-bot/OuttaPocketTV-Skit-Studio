name: OPTV TikTok Public Link Discovery
on:
  push:
    paths:
      - '.github/workflows/optv-profile-discovery.yml'
jobs:
  public-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: List all post titles and verify video embed players
        shell: python
        run: |
          import urllib.request, re, html
          ua={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36'}
          url='https://r.jina.ai/https://www.tiktok.com/@outtapockettv101'
          with urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=35) as r:
            src=r.read(130000).decode('utf-8','replace')
          print('PAGE_TEXT',len(src),flush=True)
          ms=list(re.finditer(r'https://www.tiktok.com/@outtapockettv101/video/(\d{17,22})',src))
          seen=set()
          for m in ms:
            vid=m.group(1)
            if vid in seen: continue
            seen.add(vid)
            before=re.sub(r'\s+',' ',src[max(0,m.start()-75):m.start()])
            after=src[m.end():m.end()+900]
            match=re.search(r'Image \d+: (.*?) created by',after,re.S)
            desc=(match.group(1) if match else after[:125]).replace('\n',' ')
            print('VIDEO',vid,'PRE',before[-70:],'TITLE',desc[:240],flush=True)
            if len(seen)>=45: break
          for vid in ['7697383876368305421','7700480890257820941','7702540656266284302','7702210754451164430']:
            for base in ['https://www.tiktok.com/player/v1/','https://www.tiktok.com/embed/v2/']:
              try:
                url=base+vid
                req=urllib.request.Request(url,headers=ua)
                with urllib.request.urlopen(req,timeout=8) as r: print('PLAYER',url,r.status,r.headers.get('Content-Type'),flush=True)
              except Exception as e: print('PLAYER_ERR',base,vid,str(e)[:130],flush=True)
