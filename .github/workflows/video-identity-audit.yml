name: OuttaPocketTV Public Video Identity Audit
on:
  push:
    paths:
      - '.github/workflows/video-identity-audit.yml'
jobs:
  identify:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: Match captions to exact target URLs and card ordering
        shell: python
        run: |
          import urllib.request,re,html,json
          ua={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127.0.0.0 Safari/537.36'}
          req=urllib.request.Request('https://r.jina.ai/https://www.tiktok.com/@outtapockettv101',headers=ua)
          with urllib.request.urlopen(req,timeout=45) as r: md=r.read(140000).decode('utf-8','replace')
          print('PROFILE_LENGTH',len(md),flush=True)
          pattern=r'https://www.tiktok.com/@outtapockettv101/video/(\d{17,22})'
          videos=list(re.finditer(pattern,md))
          print('PUBLIC_COUNT',len(videos),flush=True)
          for i,m in enumerate(videos[:24]):
            left=md[max(0,m.start()-1200):m.start()]
            marks=list(re.finditer(r'Image \d+: (.*?) created by OuttaPocketTV',left,re.S))
            desc=marks[-1].group(1) if marks else 'NO DESCRIPTION BEFORE ID'
            print('VIDEO',i,'ID',m.group(1),'CAPTION_BEFORE',re.sub(r'\s+',' ',desc)[:260],'PINNED_NEAR_LINK',bool(re.search(r'Pinned\]\($',left[-100:])),'IMMEDIATE_BEFORE',re.sub(r'\s+',' ',left[-115:]),flush=True)
          print('FIRST_TEXT',re.sub(r'\s+',' ',md[:3500])[:3500],flush=True)
          for vid in ['7697383876368305421','7700480890257820941','7702540656266284302','7702210754451164430','7702201665935445261','7700784848306261262']:
            url='https://r.jina.ai/https://www.tiktok.com/@outtapockettv101/video/'+vid
            try:
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=20) as r: response=r.read(23000).decode('utf-8','replace')
              print('SINGLE',vid,'TITLE',response[:1000].replace('\n',' | '),flush=True)
            except Exception as e:
              print('SINGLE_ERROR',vid,str(e)[:110],flush=True)
